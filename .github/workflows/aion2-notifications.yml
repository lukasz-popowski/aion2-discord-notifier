name: AION 2 notifications

on:
  workflow_dispatch:
    inputs:
      test_translation:
        description: 'Send one translated TEST message to Discord (no Steam announcements)'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: aion2-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check required secrets
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: |
          test -n "$DISCORD_WEBHOOK_URL" || { echo 'Missing DISCORD_WEBHOOK_URL'; exit 1; }
          test -n "$GOOGLE_TRANSLATE_API_KEY" || { echo 'Missing GOOGLE_TRANSLATE_API_KEY'; exit 1; }
      - name: Test Polish translation and Discord delivery
        if: github.event_name == 'workflow_dispatch' && inputs.test_translation == true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: python notifier.py --test-notification
      - name: Fetch and publish notifications
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.test_translation != true)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: python notifier.py
      - name: Save notification state
        if: success()
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state.json
            git commit -m 'chore: update AION 2 notification state'
            git push
          else
            echo 'No notification state changes'
          fi
