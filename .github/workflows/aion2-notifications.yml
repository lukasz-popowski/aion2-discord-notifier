
name: AION 2 notifications

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: aion2-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      
      
      - name: Test Discord webhook
        if: github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.environ["DISCORD_WEBHOOK_URL"]

          payload = {
              "username": "AION 2 Notifications",
              "allowed_mentions": {"parse": []},
              "embeds": [{
                  "title": "AION 2 — Test powiadomienia",
                  "description": "Połączenie GitHub Actions → Discord Webhook działa poprawnie.",
                  "color": 5763719,
                  "fields": [
                      {"name": "Region", "value": "Europa", "inline": True},
                      {"name": "Serwer", "value": "Phernos", "inline": True},
                      {"name": "Status", "value": "Test zakończony pomyślnie", "inline": False}
                  ]
              }]
          }

          request = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={
  			  "Content-Type": "application/json",
    			  "User-Agent": "AION2-Discord-Notifier/1.0"
	      },
	      method="POST"
          )

          with urllib.request.urlopen(request, timeout=15) as response:
              print(f"Discord HTTP status: {response.status}")
          PY

      - name: Fetch and publish notifications
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: python notifier.py

      - name: Save notification state
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update AION 2 notification state"
            git push
          fi

